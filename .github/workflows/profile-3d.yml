# Generates 3D isometric contribution calendar SVGs and commits them to main.
#
# Output folder: profile-3d-contrib/
# Generated files:
#   profile-night-view.svg
#   profile-green-animate.svg
#   profile-season-animate.svg
#   profile-gitblock.svg
#
# README references: ./profile-3d-contrib/profile-night-view.svg (relative path)
#
# Source: https://github.com/yoshi389111/github-profile-3d-contrib

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # daily at 18:00 UTC
  workflow_dispatch: {}     # allows manual "Run workflow" trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate 3D contribution calendar"
            git push
          fi

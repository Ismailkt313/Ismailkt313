# Generates the animated "snake eats contribution graph" SVG and publishes it
# to the "output" branch so raw.githubusercontent.com can serve it.
#
# README references:
#   https://raw.githubusercontent.com/Ismailkt313/Ismailkt313/output/github-contribution-grid-snake.svg
#   https://raw.githubusercontent.com/Ismailkt313/Ismailkt313/output/github-contribution-grid-snake-dark.svg
#
# Source: https://github.com/Platane/snk

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch: {}       # allows manual "Run workflow" trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}